<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('RevPlay - Genres')}"></head>

<body>
    <div id="app-page" class="app-layout">
        <aside th:replace="~{fragments :: sidebar('genres')}"></aside>
        <main class="main-content">
            <div th:replace="~{fragments :: topbar}"></div>
            <div class="content-area animate-in" id="content-area">
                <div class="page-header">
                    <h2>Genres</h2>
                </div>
                <div class="cards-grid">
                    <div th:each="genre, iter : ${genres}" class="card">
                        <div class="card-image" th:style="${'background:linear-gradient(135deg, #7c3aed, #e879f9)'}">🎸
                        </div>
                        <div class="card-title" th:text="${genre.genreName}">Genre Name</div>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments :: player}"></div>
    </div>
    <div th:replace="~{fragments :: scripts}"></div>
</body>

</html>
