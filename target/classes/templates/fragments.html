<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Head Fragment -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RevPlay - Premium Music Streaming Platform.">
    <title th:text="${title}">RevPlay - Music Streaming</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=2)}">
</head>

<body>
    <!-- Sidebar Fragment -->
    <aside th:fragment="sidebar(activePage)" class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <span>🎵</span> RevPlay
        </div>

        <div class="sidebar-section">Browse</div>
        <a onclick="navigate('home')" class="sidebar-item" style="cursor:pointer">
            <span class="icon">🏠</span> Home
        </a>
        <a onclick="navigate('songs')" class="sidebar-item" style="cursor:pointer">
            <span class="icon">🎶</span> Songs
        </a>
        <a onclick="navigate('albums')" class="sidebar-item" style="cursor:pointer">
            <span class="icon">💿</span> Albums
        </a>
        <a onclick="navigate('artists')" class="sidebar-item" style="cursor:pointer">
            <span class="icon">🎤</span> Artists
        </a>
        <a onclick="navigate('genres')" class="sidebar-item" style="cursor:pointer">
            <span class="icon">🎸</span> Genres
        </a>
        <a onclick="navigate('podcasts')" class="sidebar-item" style="cursor:pointer">
            <span class="icon">🎙️</span> Podcasts
        </a>

        <div class="sidebar-section" id="user-sidebar-section">Your Library</div>
        <a onclick="navigate('playlists')" class="sidebar-item" id="sidebar-playlists" style="cursor:pointer">
            <span class="icon">📋</span> Playlists
        </a>
        <a onclick="navigate('favorites')" class="sidebar-item" id="sidebar-favorites" style="cursor:pointer">
            <span class="icon">❤️</span> Favorites
        </a>
        <a onclick="navigate('history')" class="sidebar-item" id="sidebar-history" style="cursor:pointer">
            <span class="icon">📜</span> History
        </a>

        <div class="sidebar-section artist-only" style="display:none; text-transform:uppercase;">ARTIST STUDIO</div>
        <a onclick="navigate('upload')" class="sidebar-item artist-only" style="cursor:pointer; display:none">
            <span class="icon">⬆️</span> Upload Song
        </a>
        <a onclick="navigate('my-songs')" class="sidebar-item artist-only" style="cursor:pointer; display:none">
            <span class="icon">🎵</span> My Songs
        </a>
        <a onclick="navigate('my-albums')" class="sidebar-item artist-only" style="cursor:pointer; display:none">
            <span class="icon">💿</span> My Albums
        </a>
        <a onclick="navigate('my-podcasts')" class="sidebar-item artist-only" style="cursor:pointer; display:none">
            <span class="icon">🎙️</span> My Podcasts
        </a>
        <a onclick="navigate('stats')" class="sidebar-item artist-only" style="cursor:pointer; display:none">
            <span class="icon">📊</span> Analytics
        </a>

        <div class="sidebar-spacer"></div>
        <a onclick="logout()" class="sidebar-item" style="cursor:pointer">
            <span class="icon">🚪</span> Logout
        </a>
    </aside>

    <!-- Top Bar Fragment -->
    <div th:fragment="topbar" class="top-bar">
        <div class="search-bar">
            <span class="icon">🔍</span>
            <input type="text" id="search-input" placeholder="Search songs, artists, albums..."
                onkeyup="handleSearch(event)">
        </div>
        <div class="top-bar-right">
            <div class="user-chip" onclick="navigate('profile')">
                <div class="user-avatar" id="user-avatar">U</div>
                <span class="user-chip-name" id="user-display-name">User</span>
            </div>
            <button class="btn btn-secondary btn-sm logout-btn" onclick="logout()" title="Logout">🚪 Logout</button>
        </div>
    </div>

    <!-- Player Bar Fragment -->
    <div th:fragment="player" class="player-bar" id="player-bar" style="display:none">
        <div class="player-track">
            <div class="player-thumb" id="player-thumb">🎵</div>
            <div class="player-track-info">
                <div class="player-track-title" id="player-title">No song playing</div>
                <div class="player-track-artist" id="player-artist">-</div>
            </div>
        </div>
        <div class="player-controls">
            <div class="player-buttons">
                <button class="player-btn" id="btn-shuffle" onclick="toggleShuffle()" title="Shuffle">🔀</button>
                <button class="player-btn" onclick="playPrev()" title="Previous">⏮</button>
                <button class="player-play-btn" id="btn-play-pause" onclick="togglePlayPause()">▶</button>
                <button class="player-btn" onclick="playNext()" title="Next">⏭</button>
                <button class="player-btn" id="btn-repeat" onclick="toggleRepeat()" title="Repeat">🔁</button>
            </div>
            <div class="player-progress">
                <span class="player-time" id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar" onclick="seekTo(event)">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span class="player-time" id="total-time">0:00</span>
            </div>
        </div>
        <div class="player-extras">
            <button class="player-btn song-action-btn" id="player-fav-btn" onclick="togglePlayerFavorite()">🤍</button>
            <button class="player-btn" onclick="showQueueModal()" title="Queue" style="font-size:14px">📋</button>
            <div class="volume-control">
                <span class="player-btn" style="font-size:14px">🔊</span>
                <div class="volume-bar" onclick="setVolume(event)">
                    <div class="volume-fill" id="volume-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Fragment -->
    <div th:fragment="modal" class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
        <div class="modal" id="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modal-title">Modal</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Toast Fragment -->
    <div th:fragment="toast" class="toast-container" id="toast-container"></div>

    <!-- Scripts Fragment -->
    <div th:fragment="scripts">
        <script th:src="@{/js/app.js(v=2)}"></script>
    </div>

</body>

</html>
